plugins {
  id 'org.jetbrains.kotlin.plugin.serialization' version "$kotlinVersion"
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

// Generate AppVersion.kt file with the version from gradle.properties
task generateVersionInfo {
  def outputDir = file("$buildDir/generated/source/version/main/kotlin")
  outputs.dir outputDir

  doLast {
    def versionFile = file("$outputDir/edu/b4kancs/languagePuzzleApp/app/AppVersion.kt")
    versionFile.parentFile.mkdirs()
    versionFile.text = """
package edu.b4kancs.languagePuzzleApp.app

/**
 * Application version information.
 * This file is automatically generated by Gradle. Do not edit manually.
 */
object AppVersion {
    /** The current version of the application */
    const val VERSION = "$version"
}
""".trim()
  }
}

// Ensure version file is generated before compilation
compileKotlin.dependsOn generateVersionInfo

// Add the generated source directory to the source sets
sourceSets.main.kotlin.srcDirs += "$buildDir/generated/source/version/main/kotlin"

dependencies {
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"

  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"

  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  api "io.github.libktx:ktx-app:$ktxVersion"
  api "io.github.libktx:ktx-collections:$ktxVersion"
  api "io.github.libktx:ktx-freetype:$ktxVersion"
  api "io.github.libktx:ktx-graphics:$ktxVersion"
  api "io.github.libktx:ktx-i18n:$ktxVersion"
  api "io.github.libktx:ktx-inject:$ktxVersion"
  api "io.github.libktx:ktx-log:$ktxVersion"
  api "io.github.libktx:ktx-preferences:$ktxVersion"
  api "io.github.libktx:ktx-scene2d:$ktxVersion"

  implementation "space.earlygrey:shapedrawer:$shapedrawerVersion"
//  implementation "com.github.raeleus.TenPatch:tenpatch:$tenpatchVersion"
}
